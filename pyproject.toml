[project]
name = "bbot-swarm-common"
version = "0.1.0"
description = "Shared wire protocol, models, and cryptography for BBOT Swarm"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "orjson>=3.11",
    "cryptography>=44",
    "websockets>=15",
    "bbot",
]

[project.scripts]
bbot-swarm-keygen = "swarm_common.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm_common"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7",
    "ruff>=0.15",
]

[tool.uv.sources]
bbot = { git = "https://github.com/blacklanternsecurity/bbot", rev = "dev" }

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "bbot.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
